name: Build Android APK

on:
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build QL NSX-HSD APK
runs-on: ubuntu-latest

steps:
  # 1. Lấy mã nguồn từ GitHub
  - name: Checkout source
    uses: actions/checkout@v4

  # 2. Cài Java 17
  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  # 3. Cài Gradle 8.7
  - name: Set up Gradle 8.7
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  # 4. Tạo cấu trúc dự án Android
  - name: Generate Android project
    shell: bash
    run: |
      set -e

      mkdir -p android/app/src/main/java/com/qlnshsd/app
      mkdir -p android/app/src/main/res/values
      mkdir -p android/app/src/main/assets

      # Tìm HTML giao diện hiện có
      HTML_FILE=""

      for f in Index.html index.html Index.gs.html Index_goc_backup.txt; do
        if [ -f "$f" ]; then
          HTML_FILE="$f"
          break
        fi
      done

      if [ -n "$HTML_FILE" ]; then
        cp "$HTML_FILE" android/app/src/main/assets/index.html
      else
        cat > android/app/src/main/assets/index.html <<'HTML'
      <!DOCTYPE html>
      <html lang="vi">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>QL NSX-HSD</title>
      </head>
      <body>
        <h2>QL NSX-HSD</h2>
        <p>Chưa tìm thấy file giao diện HTML trong kho mã nguồn.</p>
      </body>
      </html>
      HTML
      fi

      # Cấu hình Gradle cấp dự án
      cat > android/settings.gradle <<'EOF'
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }

      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
              google()
              mavenCentral()
          }
      }

      rootProject.name = 'QLNSHSD'
      include ':app'
      EOF

      cat > android/build.gradle <<'EOF'
      plugins {
          id 'com.android.application' version '8.6.1' apply false
      }
      EOF

      # Cấu hình ứng dụng
      cat > android/app/build.gradle <<'EOF'
      plugins {
          id 'com.android.application'
      }

      android {
          namespace 'com.qlnshsd.app'
          compileSdk 35

          defaultConfig {
              applicationId 'com.qlnshsd.app'
              minSdk 23
              targetSdk 28
              versionCode 1
              versionName '1.0'
          }
      }
      EOF

      # Khai báo quyền Internet và camera
      cat > android/app/src/main/AndroidManifest.xml <<'EOF'
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">

          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.CAMERA" />

          <uses-feature
              android:name="android.hardware.camera"
              android:required="false" />

          <application
              android:label="QL NSX-HSD"
              android:theme="@android:style/Theme.Material.Light.NoActionBar"
              android:usesCleartextTraffic="false">

              <activity
                  android:name=".MainActivity"
                  android:exported="true">

                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>

              </activity>
          </application>
      </manifest>
      EOF

      # Tạo ứng dụng WebView
      cat > android/app/src/main/java/com/qlnshsd/app/MainActivity.java <<'EOF'
      package com.qlnshsd.app;

      import android.app.Activity;
      import android.os.Bundle;
      import android.webkit.WebChromeClient;
      import android.webkit.WebView;
      import android.webkit.WebViewClient;
      import android.webkit.WebSettings;
      import android.webkit.PermissionRequest;
      import android.widget.Toast;

      public class MainActivity extends Activity {

          private WebView webView;

          @Override
          protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              webView = new WebView(this);
              setContentView(webView);

              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setAllowFileAccess(true);
              settings.setMediaPlaybackRequiresUserGesture(false);

              webView.setWebViewClient(new WebViewClient());

              webView.setWebChromeClient(new WebChromeClient() {
                  @Override
                  public void onPermissionRequest(PermissionRequest request) {
                      runOnUiThread(() -> {
                          String[] resources = request.getResources();
                          boolean cameraRequested = false;

                          for (String resource : resources) {
                              if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)) {
                                  cameraRequested = true;
                              }
                          }

                          if (cameraRequested) {
                              request.grant(resources);
                          } else {
                              request.deny();
                          }
                      });
                  }

                  @Override
                  public void onGeolocationPermissionsShowPrompt(
                          String origin,
                          android.webkit.GeolocationPermissions.Callback callback) {
                      callback.invoke(origin, false, false);
                  }
              });

              webView.loadUrl("file:///android_asset/index.html");
          }

          @Override
          public void onBackPressed() {
              if (webView != null && webView.canGoBack()) {
                  webView.goBack();
              } else {
                  super.onBackPressed();
              }
          }

          @Override
          protected void onDestroy() {
              if (webView != null) {
                  webView.destroy();
              }
              super.onDestroy();
          }
      }
      EOF

  # 5. Xây dựng APK
  - name: Build APK
    working-directory: android
    run: gradle --no-daemon assembleDebug

  # 6. Lưu APK để tải về
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: QLNSHSD-Android-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 7
