name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK via Flutter WebView
        run: |
          flutter create --template=app --org com.qlnshsd qlnshsd_app
          cd qlnshsd_app

          mkdir -p assets
          # Tự động tìm và đổi tên tệp Index.gs.html thành index.html cho ứng dụng
          if [ -f ../Index.gs.html ]; then
            cp ../Index.gs.html assets/index.html
          elif [ -f ../Index.html ]; then
            cp ../Index.html assets/index.html
          else
            echo "<h1>QLNSHSD App</h1>" > assets/index.html
          fi

          cat << 'EOF' > pubspec.yaml
          name: qlnshsd_app
          description: QLNSHSD Mobile App
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.4.2
          flutter:
            uses-material-design: true
            assets:
              - assets/index.html
          EOF

          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MaterialApp(home: WebViewApp(), debugShowCheckedModeBanner: false));

          class WebViewApp extends StatefulWidget {
            const WebViewApp({super.key});
            @override
            State<WebViewApp> createState() => _WebViewAppState();
          }

          class _WebViewAppState extends State<WebViewApp> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unlimited)
                ..loadFlutterAsset('assets/index.html');
            }

            @override
            Widget build(BuildContext context) {
              return const Scaffold(
                body: SafeArea(child: WebViewWidget(controller: WebViewController())),
              );
            }
          }
          EOF

          # Sửa lại đoạn code khởi tạo controller chuẩn
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MaterialApp(home: WebViewApp(), debugShowCheckedModeBanner: false));

          class WebViewApp extends StatefulWidget {
            const WebViewApp({super.key});
            @override
            State<WebViewApp> createState() => _WebViewAppState();
          }

          class _WebViewAppState extends State<WebViewApp> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unlimited)
                ..loadFlutterAsset('assets/index.html');
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(child: WebViewWidget(controller: controller)),
              );
            }
          }
          EOF

          flutter pub get
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLNSHSD-App-Debug
          path: qlnshsd_app/build/app/outputs/flutter-apk/app-debug.apk
          
