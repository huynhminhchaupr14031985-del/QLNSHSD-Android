name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Build Webview App to APK
        run: |
          # Tạo dự án Flutter mới tinh gọn
          flutter create --template=app --org com.qlnshsd qlnshsd_app
          cd qlnshsd_app

          # Đưa file Index.html của bạn vào thư mục assets của Flutter
          mkdir -p assets
          if [ -f ../Index.html ]; then
            cp ../Index.html assets/index.html
          else
            echo "<h1>QLNSHSD App</h1>" > assets/index.html
          fi

          # Cấu hình để Flutter load file HTML cục bộ qua WebView
          cat << 'EOF' > pubspec.yaml
          name: qlnshsd_app
          description: QLNSHSD Mobile App
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.4.2
          flutter:
            uses-material-design: true
            assets:
              - assets/index.html
          EOF

          # Tạo mã nguồn MainActivity/WebView chuẩn của Flutter
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MaterialApp(home: WebViewApp(), debugShowCheckedModeBanner: false));

          class WebViewApp extends StatefulWidget {
            const WebViewApp({super.key});
            @override
            State<WebViewApp> createState() => _WebViewAppState();
          }

          class _WebViewAppState extends State<WebViewApp> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unlimited)
                ..loadFlutterAsset('assets/index.html');
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(child: WebViewWidget(controller: controller)),
              );
            }
          }
          EOF

          # Tải thư viện và tiến hành build ra file APK Debug
          flutter pub get
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLNSHSD-App-Debug
          path: qlnshsd_app/build/app/outputs/flutter-apk/app-debug.apk
          
