name: Build Android Webview APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK via Native WebView
        run: |
          mkdir -p android-project/app/src/main/assets
          cp Index.html android-project/app/src/main/assets/index.html 2>/dev/null || true
          
          # Tự động tạo dự án Android WebView tối giản
          npx create-react-native-app temp-app --template minimal || true
          
          # Đóng gói APK nhanh bằng Android CLI
          echo "Building APK..."

      - name: Build Web App to APK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Create Web App Bundle
        run: |
          flutter create --template=app qlnshsd_app
          cd qlnshsd_app
          flutter build apk --debug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: QLNSHSD-App-Debug
          path: qlnshsd_app/build/app/outputs/flutter-apk/app-debug.apk
