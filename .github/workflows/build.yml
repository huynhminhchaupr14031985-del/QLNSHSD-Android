name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate and Build App
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/java/com/qlnshsd/app

          # Copy file Index.html vào thư mục assets
          cp Index.html android/app/src/main/assets/index.html 2>/dev/null || echo "<h1>QLNSHSD App</h1>" > android/app/src/main/assets/index.html

          # Tạo cấu hình build.gradle gốc
          echo "allprojects { repositories { google(); mavenCentral() } }" > android/build.gradle

          # Tạo file app/build.gradle
          cat << 'EOF' > android/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.qlnshsd.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.qlnshsd.app"
                  minSdk 21
                  targetSdk 33
              }
          }
          EOF

          # Tạo AndroidManifest.xml
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <application android:label="QLNSHSD" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Tạo file MainActivity.java
          cat << 'EOF' > android/app/src/main/java/com/qlnshsd/app/MainActivity.java
          package com.qlnshsd.app;
          import android.os.Bundle;
          import android.webkit.WebView;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView w = new WebView(this);
                  setContentView(w);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          # Tiến hành build trực tiếp bằng công cụ dòng lệnh
          cd android
          sdkmanager --install "platforms;android-33" || true
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QL-NSX-HSD-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
