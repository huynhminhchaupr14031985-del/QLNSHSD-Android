name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Webview App
        run: |
          mkdir -p android/app/src/main/java/com/qlnshsd/app
          
          cat << 'EOF' > android/build.gradle
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > android/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.qlnshsd.app'
              compileSdk 33
              defaultConfig { applicationId "com.qlnshsd.app"; minSdk 21; targetSdk 33 }
          }
          dependencies { implementation 'androidx.appcompat:appCompat:1.6.1' }
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <application android:label="QLNSHSD" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Thay LINK_WEB_APP_CUA_BAN bằng URL Google Apps Script của bạn ở dòng dưới đây
          cat << 'EOF' > android/app/src/main/java/com/qlnshsd/app/MainActivity.java
          package com.qlnshsd.app;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView w = new WebView(this);
                  setContentView(w);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.loadUrl("ĐIỀN_URL_WEB_APP_GOOGLE_SCRIPT_VÀO_ĐÂY");
              }
          }
          EOF

          gradle wrapper --gradle-version 8.0 --project-dir android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QL-NSX-HSD-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
