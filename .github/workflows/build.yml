
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Check MainActivity Source
        run: |
          if [ ! -f app/src/main/java/vn/qlnshsd/app/MainActivity.java ]; then
            echo "ERROR: Khong tim thay MainActivity.java"
            exit 1
          fi
          echo "Da tim thay MainActivity.java"

      - name: Create Android Project
        run: |
          mkdir -p android/app/src/main/java/vn/qlnshsd/app
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values

          cp app/src/main/java/vn/qlnshsd/app/MainActivity.java android/app/src/main/java/vn/qlnshsd/app/MainActivity.java

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'QLNSHSD'
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'vn.qlnshsd.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'vn.qlnshsd.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 3
                  versionName '1.2'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > android/app/src/main/res/drawable/ic_launcher_box.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#176B43"
                  android:pathData="M0,0 L108,0 L108,108 L0,108 Z" />
              <path android:fillColor="#DDA568"
                  android:pathData="M18,35 L54,17 L91,35 L54,55 Z" />
              <path android:fillColor="#C78A4B"
                  android:pathData="M18,35 L54,55 L54,88 L18,68 Z" />
              <path android:fillColor="#A96C39"
                  android:pathData="M54,55 L91,35 L91,68 L54,88 Z" />
          </vector>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_box" />
          </adaptive-icon>
          EOF

          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="launcher_background">#176B43</color>
          </resources>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <application
                  android:allowBackup="false"
                  android:label="QL NSX-HSD"
                  android:icon="@drawable/ic_launcher_box"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Verify Android Source
        run: |
          grep -n "AKfycbx1RNnlPHHC0LfJHWoqFrEhvt8MfxPKlsCX0SmMzOzByDCjVDdglIlnMVre-z8AdNse" android/app/src/main/java/vn/qlnshsd/app/MainActivity.java
          grep -n "ANDROID WEBVIEW" android/app/src/main/java/vn/qlnshsd/app/MainActivity.java

      - name: Build APK
        run: |
          gradle --version
          gradle -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QL-NSX-HSD-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
